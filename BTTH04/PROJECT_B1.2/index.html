<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Danh sách sinh viên</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Quản lý điểm sinh viên</h2>

<input type="text" id="name" placeholder="Họ tên">
<input type="number" id="score" placeholder="Điểm">
<button id="addBtn">Thêm</button>

<br><br>

<input type="text" id="search" placeholder="Tìm kiếm theo tên">

<select id="filterRank">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>

<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="sortScore" class="sortable">
Điểm <span id="sortIcon"></span>
</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<div id="stats"></div>

<script src="script.js"></script>

</body>
</html>
